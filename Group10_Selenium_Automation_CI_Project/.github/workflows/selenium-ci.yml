name: CampusTrack - Selenium Regression CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  automated-browser-tests:
    name: Selenium + TestNG + Maven
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_DB_PATH: ${{ runner.temp }}/campustrack-ci.db
      SESSION_SECRET: github-ci-session-secret-for-educational-demo
      TEST_MODE: '1'
      TEST_TOKEN: local-ci-demo-token
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Set up Java 17 and Maven cache
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Install app dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest httpx
      - name: Start Attendance Management application
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > app-server.log 2>&1 &
          echo $! > app-server.pid
          python scripts/wait_for_app.py http://127.0.0.1:8000/api/health 45
      - name: Run Selenium UI regression suite
        run: mvn --batch-mode --no-transfer-progress clean test -Dheadless=true -DbaseUrl=http://127.0.0.1:8000
      - name: Validate backend API behavior
        if: always()
        run: python -m pytest -q tests/
      - name: Upload HTML report, test results and failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: campustrack-test-evidence-${{ github.run_number }}
          path: |
            target/extent-report/
            target/surefire-reports/
            target/screenshots/
            app-server.log
          if-no-files-found: warn
          retention-days: 14
